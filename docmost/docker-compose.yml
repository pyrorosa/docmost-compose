services:
  docmost:
    image: docmost/docmost:0.90.0
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:18
    env_file: .env
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app-net
    logging:
      driver: json-file
      options:
        tag: "{{.Name}}"

  nginx:
    image: nginx:1.29.3-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - docmost
    restart: unless-stopped
    networks:
      - app-net

volumes:
  docmost:
  db_data:
  redis_data:

networks:
  app-net:
    driver: bridge
