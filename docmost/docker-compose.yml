services:
  docmost:
    image: docmost/docmost:0.90.0
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        tag: "{{.Name}}"

  db:
    image: postgres:18
    env_file: .env
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmost"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        tag: "{{.Name}}"

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app-net
    logging:
      driver: json-file
      options:
        tag: "{{.Name}}"

  nginx:
    image: nginx:1.29.3-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - docmost
    restart: unless-stopped
    networks:
      - app-net
    logging:
      driver: json-file
      options:
        tag: "{{.Name}}"

  prometheus:
    image: prom/prometheus:v3.11.0
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - app-net
    logging:
      driver: json-file
      options:
        tag: "{{.Name}}"

  grafana:
    image: grafana/grafana:13.0.1
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    restart: unless-stopped
    networks:
      - app-net
    depends_on:
      - prometheus
    logging:
      driver: json-file
      options:
        tag: "{{.Name}}"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks:
      - app-net
    logging:
      driver: json-file
      options:
        tag: "{{.Name}}"

  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - app-net
    logging:
      driver: json-file
      options:
        tag: "{{.Name}}"

  loki:
    image: grafana/loki:3.7.2
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    command: -config.file=/etc/loki/loki-config.yaml
    restart: unless-stopped
    networks:
      - app-net
    logging:
      driver: json-file
      options:
        tag: "{{.Name}}"

  alloy:
    image: grafana/alloy:v1.16.1
    container_name: alloy
    ports:
      - "12345:12345"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/tmp/alloy /etc/alloy/config.alloy
    restart: unless-stopped
    networks:
      - app-net
    depends_on:
      - loki
    logging:
      driver: json-file
      options:
        tag: "{{.Name}}"

volumes:
  docmost:
  db_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  app-net:
    driver: bridge
